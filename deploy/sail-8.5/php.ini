; Ajustes de PHP para FisioApp en producción.
;
; Los cuatro primeros valores son la mitigación que recomienda php.net para los
; CVE-2026-109618 y CVE-2026-109619 (RCE sin autenticar, CVSS 9.2). Son
; medidas de reducción de exposición: la única solución completa es actualizar
; PHP, pero estas medidas cierran las rutas de ataque conocidas.
;
; Aviso de PHP: https://www.php.net/archive/2026.php#2026-10-21-5

[PHP]

; CVE-2026-109618 (corrupción por falta de memoria): sin límite finito no hay
; fallo de memoria controlado por el atacante, que es el que dispara la ruta
; vulnerable. El límite de contenedor (cgroup) es la frontera de disponibilidad.
memory_limit = -1

; La aplicación no sube ficheros: no hay ningún UploadFile, store() ni
; move_uploaded_file() en el código. Bajarlo a 8M/2M reduce la superficie de
; ataque de la petición.
post_max_size = 8M
upload_max_filesize = 2M

; CVE-2026-109619 (estado global obsoleto): la carga de progreso de sesión es
; una de las rutas confirmadas. Desactivarla y reiniciar los workers.
session.upload_progress.enabled = 0

; En PHP 8.5 el backtrace de los errores fatales es otra ruta confirmada del
; mismo CVE.
fatal_error_backtraces = 0

; Sail usa estas dos para la cobertura de código y el arranque del servidor.
variables_order = EGPCS
pcov.directory = .

; Los errores no deben llegar al cliente: se registran en el log del
; contenedor. La imagen base ya viene con display_errors=Off, pero se fija
; aquí de forma explícita para que no dependa de la imagen de Ubuntu.
display_errors = Off
display_startup_errors = Off
log_errors = On
