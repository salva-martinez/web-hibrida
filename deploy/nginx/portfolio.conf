# =============================================================================
#  Vhost del portfolio — salvamartinez.es
#
#  Sirve la landing estática. Sus errores usan el mismo lenguaje gótico que la
#  página, para que un 404 no parezca de otra web.
#
#  El bloque del puerto 80 (la redirección a HTTPS) lo gestiona certbot en
#  reservas-sites.conf.
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name salvamartinez.es;

    ssl_certificate /etc/letsencrypt/live/salvamartinez.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salvamartinez.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root {{PORTFOLIO_DIR}};
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Páginas de error ----
    # "internal" impide que se accedan directamente: solo se muestran cuando
    # nginx genera el error, nunca como una URL normal.
    location ^~ /errors/ {
        internal;
        root {{PORTFOLIO_DIR}};
        default_type text/html;
    }

    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/503.html;
}
