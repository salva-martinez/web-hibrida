# =============================================================================
#  Vhost de FisioApp — fisio.salvamartinez.es
#
#  Los errores se sirven desde el disco (public/errors/*.html), no desde la
#  aplicación: así, si FisioApp está caído o en mantenimiento, el visitante ve
#  una página con el estilo de FisioApp Y se queda en fisio.salvamartinez.es.
#  "error_page" hace una redirección interna: la URL del navegador no cambia.
# =============================================================================

# ---- HTTP: redirección a HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name fisio.salvamartinez.es;

    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fisio.salvamartinez.es;

    ssl_certificate /etc/letsencrypt/live/fisio.salvamartinez.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fisio.salvamartinez.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4M;

    # ---- Proxy hacia Laravel (Sail) ----
    location / {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # La llamada a la API de Gemini puede tardar hasta 60 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # nginx sustituye los errores del upstream por sus propias páginas.
        proxy_intercept_errors on;
    }

    # ---- Assets compilados por Vite ----
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Páginas de error ----
    # "internal" impide que se accedan directamente: solo se muestran cuando
    # nginx genera el error, nunca como una URL normal.
    location ^~ /errors/ {
        internal;
        root /var/www/web-hibrida/public;
        default_type text/html;
    }

    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/$status.html;
}
