# Reverse proxy de FisioApp hacia Laravel Sail (Docker).
#
# Sail publica la aplicación en 127.0.0.1:{{APP_PORT}} (puerto interno del
# contenedor). nginx hace de proxy inverso y termina el TLS con el certificado
# de Let's Encrypt que gestiona certbot.
#
# Sustituye {{SUBDOMAIN}} y {{APP_PORT}} en deploy/bootstrap-server.sh.

server {
    listen 80;
    listen [::]:80;
    server_name {{SUBDOMAIN}};

    # Certbot añade aquí la redirección a HTTPS y el bloque de certificados
    # cuando emite el certificado con --nginx.

    # ---- Cabeceras de seguridad ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Límites ----
    # El feedback del paciente y el chat IA pueden ser largos, pero no tanto.
    client_max_body_size 4M;

    # ---- Proxy ----
    location / {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # La llamada a la API de Gemini puede tardar hasta 60 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_buffering off;
    }

    # ---- Assets compilados por Vite ----
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Comprobación de salud (sin caché) ----
    location = /up {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_set_header Host $host;
        access_log off;
    }
}
