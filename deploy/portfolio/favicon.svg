<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
        <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#191512"/>
            <stop offset="100%" stop-color="#0a0908"/>
        </linearGradient>
    </defs>

    <!-- Fondo de tinta -->
    <rect width="256" height="256" fill="url(#fondo)"/>

    <!-- Filete interior de oro viejo -->
    <rect x="18" y="18" width="220" height="220" fill="none" stroke="#b3944c" stroke-width="2" opacity="0.75"/>

    <!-- Esquinas marcadas -->
    <path d="M18 46 V18 H46" fill="none" stroke="#b3944c" stroke-width="5"/>
    <path d="M210 18 H238 V46" fill="none" stroke="#b3944c" stroke-width="5"/>
    <path d="M238 210 V238 H210" fill="none" stroke="#b3944c" stroke-width="5"/>
    <path d="M46 238 H18 V210" fill="none" stroke="#b3944c" stroke-width="5"/>

    <!-- Monograma -->
    <text x="128" y="152"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="132" font-weight="600"
          fill="#efe8d8" text-anchor="middle">S</text>

    <!-- Detalle técnico: línea de datos -->
    <g fill="#b3944c" opacity="0.85">
        <rect x="86" y="182" width="84" height="3"/>
        <rect x="104" y="191" width="48" height="3" opacity="0.6"/>
    </g>
</svg>
