; Supervisor: worker de la cola de FisioApp.
;
; El análisis de IA del feedback del paciente se genera en segundo plano. Si este
; proceso no está vivo, el feedback se guarda pero el análisis nunca aparece.
;
; Sustituye {{APP_DIR}} por la ruta real (lo hace deploy/bootstrap-server.sh).

[program:fisioapp-worker]
command=/usr/bin/docker compose exec -T laravel.test php artisan queue:work --sleep=3 --tries=3 --timeout=180 --max-time=3600
directory={{APP_DIR}}
user=deploy
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/fisioapp/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Reinicio del worker tras un despliegue: `php artisan queue:restart` pide a los
; workers existentes que terminen el job en curso y mueran; supervisor los
; relanza con el código nuevo.
