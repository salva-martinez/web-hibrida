<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — Gestión de Reservas</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f6f7;
        }

        .error-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 40px 44px;
            max-width: 30rem;
            text-align: center;
        }

        .error-card h1 {
            margin: 0 0 8px;
            font-size: 56px;
            line-height: 1;
            color: #1769aa;
        }

        .error-card h2 {
            margin: 0 0 12px;
            font-size: 20px;
            color: #292929;
        }

        .error-card p {
            margin: 0 0 24px;
            color: #5b5b5b;
            font-size: 15px;
        }

        .error-card a {
            display: inline-block;
            padding: 9px 14px;
            border: none;
            border-radius: 4px;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
            background: #1769aa;
            color: #fff;
        }

        .error-card a:hover { opacity: .9; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p>
            La reserva o la ruta que buscas no existe. Puede que se haya eliminado
            o que el enlace esté mal escrito.
        </p>
        <a href="/">Volver a las reservas</a>
    </div>
</body>
</html>
